services:
  - type: web
    name: bitehub-food-delivery
    env: node
    buildCommand: npm install && npm run build
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
    disk:
      name: bitehub-data
      mountPath: /app/server/data
      sizeGB: 1
